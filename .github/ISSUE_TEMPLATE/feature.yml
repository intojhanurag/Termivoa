name: Feature request
description: Suggest an improvement to Termivoa
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem first, then your idea. For open-ended ideas, [GitHub Discussions](https://github.com/intojhanurag/Termivoa/discussions) may be a better place. Do not include credentials, real terminal history, personal paths or confidential code.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Who is affected, and what is hard or unsafe today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: What should the phone app or `pterm` do? Describe what you would see, not only how to build it.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Phone app
        - pterm (CLI or host)
        - Several computers
        - Providers (herdr and others)
        - GitHub
        - Docs or website
        - Other
    validations:
      required: true
  - type: checkboxes
    id: contribute
    attributes:
      label: Contributing
      options:
        - label: I would like to work on this myself (see CONTRIBUTING.md).
