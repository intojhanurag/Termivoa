name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  GOTOOLCHAIN: go1.27.1
  PNPM_VERSION: 10.33.0

jobs:
  protocol-generation:
    name: protocol-generation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.11.0
      - run: corepack enable && corepack prepare pnpm@${{ env.PNPM_VERSION }} --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm protocol:check

  go-quality:
    name: go-quality
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.1
          cache: true
      - run: test -z "$(gofmt -l ./cmd ./internal ./tests ./third_party/ansi ./third_party/vt ./third_party/xpty ./third_party/ultraviolet 2>/dev/null)"
      - run: go vet ./...
      - run: CGO_ENABLED=0 GOARCH=arm64 go vet ./...
      - run: go test ./...
      - run: cd third_party/ansi && go test ./...
      - run: cd third_party/vt && go test ./...
      - run: cd third_party/xpty && go test ./...
      - run: go test github.com/charmbracelet/ultraviolet/...

  go-race:
    name: go-race
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.1
          cache: true
      - run: go test -race ./...
      - run: go test -race github.com/charmbracelet/ultraviolet/...

  web-quality:
    name: web-quality
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.11.0
      - run: corepack enable && corepack prepare pnpm@${{ env.PNPM_VERSION }} --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test:web
      - run: pnpm build:web

  macos-integration:
    name: macos-integration
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.1
      - run: go test ./tests/integration/... ./internal/ptyhost/... ./internal/terminal/... ./internal/platform/...
      - run: cd third_party/xpty && go test ./...
      - run: go test ./internal/desktop/... github.com/charmbracelet/ultraviolet/...

  windows-integration:
    name: windows-integration
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.1
      - run: go test ./tests/integration/... ./internal/ptyhost/... ./internal/terminal/... ./internal/platform/...
      - run: cd third_party/xpty && go test ./...
      - run: go test ./internal/desktop/... github.com/charmbracelet/ultraviolet/...

  linux-release-smoke:
    name: linux-release-smoke
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.1
      - name: Build static companions (amd64, arm64)
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o pterm-linux-amd64 ./cmd/pterm
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -o pterm-linux-arm64 ./cmd/pterm
      - name: Doctor runs without systemd user services or Tailscale
        run: |
          home=$(mktemp -d)
          HOME=$home XDG_RUNTIME_DIR= ./pterm-linux-amd64 doctor | tee doctor.txt || true
          grep -q 'data directory: '"$home"'/.local/share/phone-terminal' doctor.txt
          grep -q 'log directory: '"$home"'/.local/state/phone-terminal/logs' doctor.txt
      - run: sh -n scripts/install-linux.sh && sh -n packaging/linux/build.sh

  release-smoke:
    name: release-smoke-${{ matrix.target }}
    strategy:
      matrix:
        include:
          - target: macos
            os: macos-15
            artifact: pterm
          - target: windows
            os: windows-2025
            artifact: pterm.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.1
      - name: Build static companion
        shell: bash
        run: CGO_ENABLED=0 go build -trimpath -o "${{ matrix.artifact }}" ./cmd/pterm

  secret-scan:
    name: secret-scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.1
      - run: go install github.com/zricethezav/gitleaks/v8@v8.30.1
      - run: gitleaks git --redact --no-banner

  vulnerability-scan:
    name: vulnerability-scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.11.0
      - run: corepack enable && corepack prepare pnpm@${{ env.PNPM_VERSION }} --activate
      - run: pnpm install --frozen-lockfile
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
      - run: govulncheck ./...
      - run: pnpm audit --audit-level high
