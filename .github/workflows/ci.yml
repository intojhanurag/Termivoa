name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  GOTOOLCHAIN: go1.27.1
  PNPM_VERSION: 10.33.0

jobs:
  protocol-generation:
    name: protocol-generation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.11.0
      - run: corepack enable && corepack prepare pnpm@${{ env.PNPM_VERSION }} --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm protocol:check

  go-quality:
    name: go-quality
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 1.27.1
          cache: true
      - run: test -z "$(gofmt -l ./cmd ./internal ./tests ./third_party/ansi ./third_party/vt ./third_party/xpty ./third_party/ultraviolet 2>/dev/null)"
      - run: go vet ./...
      - run: go test ./...
      - run: cd third_party/ansi && go test ./...
      - run: cd third_party/vt && go test ./...
      - run: cd third_party/xpty && go test ./...
      - run: go test github.com/charmbracelet/ultraviolet/...

  go-race:
    name: go-race
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 1.27.1
          cache: true
      - run: go test -race ./...
      - run: go test -race github.com/charmbracelet/ultraviolet/...

  web-quality:
    name: web-quality
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.11.0
      - run: corepack enable && corepack prepare pnpm@${{ env.PNPM_VERSION }} --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test:web
      - run: pnpm build:web

  macos-integration:
    name: macos-integration
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 1.27.1
      - run: go test ./tests/integration/... ./internal/ptyhost/... ./internal/terminal/... ./internal/platform/...
      - run: cd third_party/xpty && go test ./...
      - run: go test ./internal/desktop/... github.com/charmbracelet/ultraviolet/...

  windows-integration:
    name: windows-integration
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 1.27.1
      - run: go test ./tests/integration/... ./internal/ptyhost/... ./internal/terminal/... ./internal/platform/...
      - run: cd third_party/xpty && go test ./...
      - run: go test ./internal/desktop/... github.com/charmbracelet/ultraviolet/...

  release-smoke:
    name: release-smoke-${{ matrix.target }}
    strategy:
      matrix:
        include:
          - target: macos
            os: macos-15
            artifact: pterm
          - target: windows
            os: windows-2025
            artifact: pterm.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 1.27.1
      - name: Build static companion
        shell: bash
        run: CGO_ENABLED=0 go build -trimpath -o "${{ matrix.artifact }}" ./cmd/pterm

  secret-scan:
    name: secret-scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 1.27.1
      - run: go install github.com/zricethezav/gitleaks/v8@v8.30.1
      - run: gitleaks git --redact --no-banner

  vulnerability-scan:
    name: vulnerability-scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 1.27.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.11.0
      - run: corepack enable && corepack prepare pnpm@${{ env.PNPM_VERSION }} --activate
      - run: pnpm install --frozen-lockfile
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
      - run: govulncheck ./...
      - run: pnpm audit --audit-level high
